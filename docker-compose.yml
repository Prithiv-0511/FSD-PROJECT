version: '3.8'

services:
  mongo:
    image: mongo:7
    container_name: announcehub-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped

  server:
    build:
      context: ./server
      dockerfile: ../Dockerfile.server
    container_name: announcehub-api
    ports:
      - "5000:5000"
    environment:
      - MONGODB_URI=mongodb://mongo:27017/announcehub
      - NODE_ENV=production
    depends_on:
      - mongo
    restart: unless-stopped

  client:
    build:
      context: ./client
      dockerfile: ../Dockerfile.client
    container_name: announcehub-client
    ports:
      - "5173:80"
    depends_on:
      - server
    restart: unless-stopped

volumes:
  mongo_data:
